# PostgreSQL 侧 TPC-C：库里已有 100 个仓（2026-10-27 用 /web/bench/tpcc/warehouse/verify 核对），
# warehouses 必须写 100 才会命中「数据已就绪」，否则脚本会先跑一轮建仓把现有 100 仓冲掉重建。
#
# duration 不用写：带故障时脚本按「故障计划终点 + --tail」算出负载时长（默认 20s 尾巴）。
workloads:
  - key: tpcc-100w
    name: tpcc
    params:
      warehouses: "100"
      concurrency: "10"
      reload: "true"          # 预检发现仓数不符时先跑建仓预热轮；一致时自动不建
