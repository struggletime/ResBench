# ============================================================================
# 15 个故障 × 每个注入 3 次 = 45 批 —— MySQL × TPC-C
#
# 现场核对（2026-10-27，只读探针）：
#   * ss -lntp：:3306 由 **宿主机 systemd 的 mysqld**（PID 3161，
#     /usr/sbin/mysqld --daemonize，datadir=/var/lib/mysql）监听；
#     docker 里的 mysql8（host 网络，PID 92835）只监听 :33060。
#   * 两个实例都有 resbench_demo，但引擎连 YOUR_DB_HOST:3306 → 落到宿主机实例。
#   * 所以本组**不配 container**（databases.yaml 的 mysql 入口已去掉 container）：
#     配 mysql8 会让 cAdvisor 采到另一个实例的容器指标，也会让 chaosblade 命令
#     被套 docker exec（而 mysql8 里没装 blade）。
#
# 组成与顺序同 matrix-pg-tpcc.yaml（15 个，每个连打 3 次 = 45 批），
# 不跑 kill、delete、append。每批 60s + 批间 30s ⇒ 45 批计划 4080s、
# 负载 4100s ≈ 68 分钟。
#
# ⚠ 强度全部拉到最高档，但 MySQL 组跑在**宿主机**上，有两处必须限幅：
#   * memory.load **保持 --mem-percent 20**，不能跟 PG 一样提到 90。
#     宿主机 503GB / 可用 459GB：20 → reserve=402GB、alloc≈57GB，整机占用
#     ~8.7% 抬到 ~20%，留 400GB 余量；90 → 申请 ~400GB，整机会 OOM 并拖死
#     同机的 PG 容器与引擎。这是本组唯一不按「最高」执行的参数。
#   * cpu.load：宿主机口径，fullload 会吃满 160 核 60 秒（容器侧只吃 32 核配额）。
#     这是这套部署上唯一无法限幅的故障，跑的时候宿主机其它负载会被拖慢；
#     3 连打意味着 3 分钟满载。
#
# 其余最高档参数与代价：
#   * 网络：loss 80%（100% 会让控制通道连回执都回不来）、delay 1000ms、
#     reorder 50%/correlation 90（90% 是空操作，仓库实测 100% 命中却没有真乱序）、
#     duplicate 90%、corrupt 90%。
#   * disk.fill：path=/boot（1014MB 的独立 xfs，现场 29.3%），percent=100 →
#     写到满。只能用 /boot：/ 已 99.17% 满（填了会伤系统），/mnt/nvme4n1 是
#     mysql8 与 pg 容器的数据盘（1% = 58GB）。到点删除填充文件后自行恢复；
#     3 连打时若上一批没删干净，这一批会填不出量（回执里能看到）。
#   * process-cmd 写 **/usr/sbin/mysqld**，只匹配宿主机服务那条命令行；写 "mysqld"
#     会把 mysql8 里那个空闲实例（:33060）也一起 SIGSTOP。chaosblade 的
#     --process-cmd 按命令行子串匹配，带路径的写法能精确落到宿主实例。
#     开 --auto-process-target 时这个值由现场探测覆盖：按 :3306 的监听进程取
#     argv[0]，并核对宿主机上只命中 mysqld.service 这一个实例。
#   * 文件路径写死 /var/lib/mysql/resbench_demo/...：宿主机 datadir 的真实路径。
#     （@auto 映射对 MySQL 不可用：db-dir → datadir 是把库目录搬进它自己的父目录。）
#   * InnoDB 一直握着已打开 .ibd 的 fd，move/chmod 的即时影响通常比 PG 温和；
#     判据以注入回执 + 同窗口的慢 SQL/TPS 合看，不要只盯一个数。
#   * connection.surge 400（max_connections=500）；limit.exceeded 800 > 500；
#     thread_saturation 溢出 300 → 364 个常驻活动会话；massive.rollback 32 线程 /
#     100% 回滚。MySQL 也没有 thread_pool_attr，DBChaos 同样按 64 基线算。
# ============================================================================

name: matrix-mysql-tpcc
key: matrix45
batches:
  # ── CPU 满载 ×3（宿主机口径，160 核）──────────────────────────────────────
  - faults:
      - nameKey: faultinject.fault.cpu.load
        params: {duration: "60"}
  - faults:
      - nameKey: faultinject.fault.cpu.load
        params: {duration: "60"}
  - faults:
      - nameKey: faultinject.fault.cpu.load
        params: {duration: "60"}

  # ── 内存满载 ×3（宿主机口径，保持 20%，见顶部说明）────────────────────────
  - faults:
      - nameKey: faultinject.fault.memory.load
        params: {memory-percent: "20", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.memory.load
        params: {memory-percent: "20", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.memory.load
        params: {memory-percent: "20", duration: "60"}

  # ── 网络类（宿主机 ens17f0，全部 autoRecovery）：丢包 80% ×3 ────────────────
  - faults:
      - nameKey: faultinject.fault.network.package
        params: {percent: "80", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.package
        params: {percent: "80", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.package
        params: {percent: "80", interface: ens17f0, duration: "60"}

  # ── 延迟 1000ms ×3 ──────────────────────────────────────────────────────
  - faults:
      - nameKey: faultinject.fault.network.delay
        params: {time: "1000", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.delay
        params: {time: "1000", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.delay
        params: {time: "1000", interface: ens17f0, duration: "60"}

  # ── 乱序 50%/correlation 90 ×3（90% 是空操作）────────────────────────────
  - faults:
      - nameKey: faultinject.fault.network.unorder
        params: {percent: "50", correlation: "90", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.unorder
        params: {percent: "50", correlation: "90", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.unorder
        params: {percent: "50", correlation: "90", interface: ens17f0, duration: "60"}

  # ── 重复 90% ×3 ─────────────────────────────────────────────────────────
  - faults:
      - nameKey: faultinject.fault.network.duplicate
        params: {percent: "90", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.duplicate
        params: {percent: "90", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.duplicate
        params: {percent: "90", interface: ens17f0, duration: "60"}

  # ── 包损坏 90% ×3 ───────────────────────────────────────────────────────
  - faults:
      - nameKey: faultinject.fault.network.corrupt
        params: {percent: "90", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.corrupt
        params: {percent: "90", interface: ens17f0, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.network.corrupt
        params: {percent: "90", interface: ens17f0, duration: "60"}

  # ── 磁盘类：/boot 写满 100% ×3（宿主机独立小分区）─────────────────────────
  - faults:
      - nameKey: faultinject.fault.disk.fill
        params: {path: /boot, percent: "100", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.disk.fill
        params: {path: /boot, percent: "100", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.disk.fill
        params: {path: /boot, percent: "100", duration: "60"}

  # ── 文件类：真实表文件移走 ×3（宿主机 datadir）────────────────────────────
  - faults:
      - nameKey: faultinject.fault.disk.filemove
        params:
          src-path: /var/lib/mysql/resbench_demo/order_line.ibd
          dst-dir: /var/lib/mysql
          duration: "60"
  - faults:
      - nameKey: faultinject.fault.disk.filemove
        params:
          src-path: /var/lib/mysql/resbench_demo/order_line.ibd
          dst-dir: /var/lib/mysql
          duration: "60"
  - faults:
      - nameKey: faultinject.fault.disk.filemove
        params:
          src-path: /var/lib/mysql/resbench_demo/order_line.ibd
          dst-dir: /var/lib/mysql
          duration: "60"

  # ── 文件类：库目录权限 000 ×3 ───────────────────────────────────────────
  - faults:
      - nameKey: faultinject.fault.disk.filechmod
        params:
          filepath: /var/lib/mysql/resbench_demo
          mark: "000"
          duration: "60"
  - faults:
      - nameKey: faultinject.fault.disk.filechmod
        params:
          filepath: /var/lib/mysql/resbench_demo
          mark: "000"
          duration: "60"
  - faults:
      - nameKey: faultinject.fault.disk.filechmod
        params:
          filepath: /var/lib/mysql/resbench_demo
          mark: "000"
          duration: "60"

  # ── 进程挂起 ×3（SIGSTOP，宿主 mysqld.service）────────────────────────────
  - faults:
      - nameKey: faultinject.fault.process.stop
        params: {process-cmd: /usr/sbin/mysqld, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.process.stop
        params: {process-cmd: /usr/sbin/mysqld, duration: "60"}
  - faults:
      - nameKey: faultinject.fault.process.stop
        params: {process-cmd: /usr/sbin/mysqld, duration: "60"}

  # ── 连接风暴 400 ×3 ─────────────────────────────────────────────────────
  - faults:
      - nameKey: faultinject.fault.connection.surge
        params: {concurrent-connections: "400", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.connection.surge
        params: {concurrent-connections: "400", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.connection.surge
        params: {concurrent-connections: "400", duration: "60"}

  # ── 连接线程饱和 ×3（线程池溢出 300 → 364 个常驻活动会话）─────────────────
  - faults:
      - nameKey: faultinject.fault.connection.thread_saturation
        params: {concurrent-connections: "300", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.connection.thread_saturation
        params: {concurrent-connections: "300", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.connection.thread_saturation
        params: {concurrent-connections: "300", duration: "60"}

  # ── 大量事务回滚 ×3（32 线程、100% 回滚）────────────────────────────────
  - faults:
      - nameKey: faultinject.fault.transaction.massive.rollback
        params: {threads: "32", rollback-rate: "100", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.transaction.massive.rollback
        params: {threads: "32", rollback-rate: "100", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.transaction.massive.rollback
        params: {threads: "32", rollback-rate: "100", duration: "60"}

  # ── 最后：连接上限打满 ×3（800 > max_connections 500）─────────────────────
  - faults:
      - nameKey: faultinject.fault.connection.limit.exceeded
        params: {attempted-connections: "800", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.connection.limit.exceeded
        params: {attempted-connections: "800", duration: "60"}
  - faults:
      - nameKey: faultinject.fault.connection.limit.exceeded
        params: {attempted-connections: "800", duration: "60"}
