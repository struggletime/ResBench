# ============================================================================
# 背景负载配置 —— 一个文件可以写多个负载
#
# 每个字段都对应前端「工作负载」面板上能填的东西：
#   key      脚本内部引用名 + 结果目录名的一部分，不发给后端
#            （结果目录 = <库key>__<负载key>__<编排key>）
#   name     smallbank | tpcc（引擎的 startByForm 只接受这两个；ycsb 不支持）
#   params   smallbank → accountsNum / terminals / duration / 六个权重
#            tpcc      → warehouses / concurrency / duration / reload
#
# 关于 duration：
#   它是「负载要跑多久」。**有故障**的编排不看这一项 —— 脚本按这一轮的故障计划算：
#   第一批注入时刻 60s，每批之间 +30s 间隔，最终 = 故障计划终点 + 尾巴（--tail，默认 20s）。
#   这一项只对**没有故障**的编排（batches: []）生效，用来让基线轮也跑够同样时长。
#   不写也行：没有故障时按计划的 60s + 尾巴算。
# ============================================================================

workloads:
  # --- smallbank，不写 duration：完全由脚本按故障计划算 ---
  - key: sm-auto
    name: smallbank
    params:
      accountsNum: "1000"
      terminals: "20"
      amalgamateWeight: "15"
      balanceWeight: "15"
      depositCheckingWeight: "15"
      sendPaymentWeight: "25"
      transactSavingsWeight: "15"
      writeCheckWeight: "15"

  # --- smallbank，明确要跑 10 分钟（比故障计划长就以这个为准）---
  - key: sm-600
    name: smallbank
    params:
      accountsNum: "1000"
      terminals: "20"
      duration: "600"
      amalgamateWeight: "15"
      balanceWeight: "15"
      depositCheckingWeight: "15"
      sendPaymentWeight: "25"
      transactSavingsWeight: "15"
      writeCheckWeight: "15"

  # --- tpcc：reload=true 表示建表 + 加载数据 ---
  # 同一个（库 + 这个负载）会跑很多轮。脚本在**第一轮之前**先查一次库里实际有多少仓：
  #   仓数对得上 → 第一轮直接当普通测试跑（不带建仓），后面几轮也不用建，省掉一次建仓；
  #   对不上 / 还没建 → 第一轮带建仓（reload=true），等它跑完再跑后面的轮次；
  #   查不出来（连不上库 / 没权限 / 引擎是旧构建）→ 不猜，按这里的 reload 配置执行。
  - key: tpcc-10w
    name: tpcc
    params:
      warehouses: "10"
      concurrency: "10"
      duration: "600"
      reload: true

  # --- tpcc：duration 只对**没有故障**的轮次（编排里 batches 写成空列表的）生效。
  # 写 320 是为了让基线轮也跑满同样的时长，否则那一轮只跑 80s，和别的轮次不可比。
  # 有故障的轮次按计划算：3 批 × 60s + 2 × 30s 间隔 + 20s 尾巴 = 320s（故障写成 30s
  # 时就是 210s + 20s = 230s）。
  - key: tpcc-10c-200
    name: tpcc
    params:
      warehouses: "100"
      concurrency: "200"
      duration: "320"
      reload: false
