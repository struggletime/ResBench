    en: SQL View Nest Stack Overflow
  description:
    zh: 通过超深度视图嵌套，模拟 SQL 编译栈溢出
    en: Overflows the SQL compiler stack through excessively nested views
  category: database
  autoRecovery: 1
  defaultDuration: 30
  asyncInjection: true
  params:
    interval:
      type: int
      unit: ms
      default: 5000
      required: false
      label:
        zh: 注入间隔
        en: Injection Interval
      description:
        zh: 两次注入之间的间隔（毫秒）
        en: Interval between two injections in milliseconds
    duration:
      type: int
      unit: s
      default: 30
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} sql stack_overflow
      -mode view_nest -duration {{duration|30|1000}} -interval {{interval|5000}}
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# Join 搜索空间爆炸：多表连接执行计划搜索爆栈（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.sql.stack_overflow.join_bomb:
  name:
    zh: SQL Join搜索空间爆炸
    en: SQL Join Bomb Stack Overflow
  description:
    zh: 通过多表连接执行计划搜索，模拟优化器爆栈
    en: Overflows the optimizer through multi-table join plan search
  category: database
  autoRecovery: 1
  defaultDuration: 30
  asyncInjection: true
  params:
    interval:
      type: int
      unit: ms
      default: 5000
      required: false
      label:
        zh: 注入间隔
        en: Injection Interval
      description:
        zh: 两次注入之间的间隔（毫秒）
        en: Interval between two injections in milliseconds
    duration:
      type: int
      unit: s
      default: 30
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} sql stack_overflow
      -mode join_bomb -duration {{duration|30|1000}} -interval {{interval|5000}}
      -url {{dbUrl}} -user {{user}} -password {{password}}


