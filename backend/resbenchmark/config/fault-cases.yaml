# ------------------------------------------------------------
# 存储过程递归执行栈溢出（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.exec.stack_overflow.proc_recurse:
  name:
    zh: 存储过程递归爆栈
    en: Exec Procedure Stack Overflow
  description:
    zh: 通过深度递归存储过程，模拟执行引擎栈溢出
    en: Overflows the execution engine stack through deeply recursive stored procedures
  category: database
