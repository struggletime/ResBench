# ------------------------------------------------------------
# 长事务持锁：未提交的长事务锁定指定表记录，制造锁冲突（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.txn.uncommitted_txn:
  name:
    zh: 长事务持锁
    en: Uncommitted Transaction Lock
  description:
    zh: 模拟业务中未提交的长事务，通过锁定记录制造锁冲突
    en: Emulates long-running uncommitted transactions that hold row locks and cause lock waits
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    table:
      type: string
      default: bmsql_stock
      required: true
      label:
        zh: 目标表
        en: Target Table
      description:
        zh: 目标业务表名，多个表用逗号分隔
        en: Target table name, separate multiple tables with commas
    holders:
      type: int
      default: 2
      required: false
      label:
        zh: 持锁事务数
        en: Holder Threads
      description:
        zh: 持锁并发线程数
        en: Number of concurrent lock-holding threads
    rows:
      type: int
      default: 500
      required: false
      label:
        zh: 锁定行数
        en: Locked Rows
      description:
        zh: 每个线程在每个表上锁定的行数
        en: Rows locked per thread per table
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} txn uncommitted_txn
      -duration {{duration|60|1000}} -table {{table|bmsql_stock}} -holders {{holders|2}}
      -rows {{rows|500}} -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# 热点事务冲突：高并发热点行操作，诱发行锁等待/超时/死锁/唯一约束冲突（无 check 子命令）
#  本 case 的 -duration 单位是「秒」，模板不加 ×1000
# ------------------------------------------------------------
faultinject.fault.txn.duplicate_txn:
  name:
    zh: 热点事务冲突
    en: Duplicate Transaction Conflict
  description:
    zh: 模拟高并发热点行操作，诱发行锁等待、超时、死锁或主键冲突
    en: Emulates high-concurrency hot-row operations to trigger lock waits, timeouts, deadlocks or key conflicts
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    sessions:
      type: int
      default: 50
      required: false
      label:
        zh: 并发会话数
        en: Concurrent Sessions
      description:
        zh: 同时执行热点操作的会话数
        en: Number of sessions performing hot-row operations
    mode:
      type: string
      default: UPDATE
      required: false
      label:
        zh: 操作模式
        en: Operation Mode
      description:
        zh: 操作类型，可选 UPDATE 行锁争抢 / INSERT 主键冲突
        en: Operation type, either UPDATE for lock contention or INSERT for key conflicts
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} txn duplicate_txn
      -sessions {{sessions|50}} -duration {{duration|60}} -mode {{mode|UPDATE}}
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# 死锁检测风暴：长事务锚点 + 交叉乱序加锁，诱导死锁检测器过载（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.txn.deadlock_storm:
  name:
    zh: 死锁检测风暴
    en: Deadlock Storm
  description:
    zh: 通过长事务锚点和交叉乱序加锁，诱导死锁检测器过载
    en: Overloads the deadlock detector with long-transaction anchors and interleaved lock requests
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    table:
      type: string
      default: bmsql_stock
      required: false
      label:
        zh: 目标表
        en: Target Table
      description:
        zh: 制造交叉冲突的目标表名
        en: Target table used to create interleaved conflicts
    anchors:
      type: int
      default: 2
      required: false
      label:
        zh: 锚定事务数
        en: Anchor Transactions
      description:
        zh: 长时间持有锁的锚点事务数
        en: Number of long-running anchor transactions holding locks
    anchor-rows:
      type: int
      default: 20
      required: false
      label:
        zh: 锚点锁定行数
        en: Anchor Rows
      description:
        zh: 每个锚点事务锁定的行数
        en: Rows locked by each anchor transaction
    waiters:
      type: int
      default: 16
      required: false
      label:
        zh: 交叉等待线程数
        en: Waiter Threads
      description:
        zh: 制造交叉等待的并发线程数
        en: Concurrent threads creating interleaved waits
    hot-rows:
      type: int
      default: 32
      required: false
      label:
        zh: 热点行数
        en: Hot Rows
      description:
        zh: 用于制造交叉冲突的热点行数（最小为 4）
        en: Hot rows used for interleaved conflicts, minimum 4
    step-delay:
      type: int
      unit: ms
      default: 50
      required: false
      label:
        zh: 取锁延迟
        en: Step Delay
      description:
        zh: 两次取锁之间的延迟（毫秒）
        en: Delay between two lock acquisitions in milliseconds
    statement-timeout:
      type: int
      unit: s
      default: 5
      required: false
      label:
        zh: 语句超时
        en: Statement Timeout
      description:
        zh: 单条语句的超时秒数
        en: Per-statement timeout in seconds
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} txn deadlock_storm
      -duration {{duration|60|1000}} -table {{table|bmsql_stock}} -anchors {{anchors|2}}
      -anchor-rows {{anchor-rows|20}} -waiters {{waiters|16}} -hot-rows {{hot-rows|32}}
      -step-delay {{step-delay|50}} -statement-timeout {{statement-timeout|5}}
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# Prepared/XA 事务积压：并发 prepare 挤兑二阶段提交事务上限（无 check 子命令）
# ⚠ 本 case 的 -duration 单位是「秒」，模板不加 ×1000
# ------------------------------------------------------------
faultinject.fault.txn.max_prepared:
  name:
    zh: Prepared事务积压
    en: Max Prepared Transaction
  description:
    zh: 并发触发 Prepared Transaction，挤兑二阶段提交事务上限
    en: Concurrently prepares transactions to exhaust the two-phase commit limit
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    count:
      type: int
      default: 201
      required: false
      label:
        zh: 目标事务数
        en: Target Count
      description:
        zh: 目标 prepared 事务数，默认取系统上限 + 1
        en: Target number of prepared transactions, defaults to the system limit plus one
    concurrency:
      type: int
      default: 50
      required: false
      label:
        zh: 并发数
        en: Concurrency
      description:
        zh: 并发准备事务的线程数
        en: Threads preparing transactions concurrently
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} txn max_prepared
      -count {{count|201}} -duration {{duration|60}} -concurrency {{concurrency|50}}
      -url {{dbUrl}} -user {{user}} -password {{password}}


# ============================================================
# 五、存储引擎与日志（storage / buffer / log）
# ============================================================

# ------------------------------------------------------------
# MVCC 膨胀：快照锚点钉住 xmin 地平线 + 高频更新制造版本膨胀（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.storage.mvcc_bloat:
  name:
    zh: MVCC膨胀注入
    en: MVCC Bloat
  description:
    zh: 通过快照锚点钉住 xmin 地平线，高频更新制造版本膨胀
    en: Pins the xmin horizon with snapshot anchors and bloats versions through frequent updates
  category: database
  autoRecovery: 1
  defaultDuration: 120
  asyncInjection: true
  params:
    anchors:
      type: int
      default: 1
      required: false
      label:
        zh: 锚定事务数
        en: Snapshot Anchors
      description:
        zh: 钉住 xmin 地平线的锚点事务数
        en: Anchor transactions that pin the xmin horizon
    mutators:
      type: int
      default: 8
      required: false
      label:
        zh: 写入线程数
        en: Mutator Threads
      description:
        zh: 高频更新热点表的并发线程数
        en: Threads performing frequent updates on hot tables
    rows:
      type: int
      default: 20000
      required: false
      label:
        zh: 初始化行数
        en: Initial Rows
      description:
        zh: 沙盒表初始化行数
        en: Rows initialized in the sandbox table
    payload-kb:
      type: int
      unit: KB
      default: 2
      required: false
      label:
        zh: 行载荷大小
        en: Payload Size
      description:
        zh: 每行载荷大小（KB）
        en: Payload size per row in KB
    duration:
      type: int
      unit: s
      default: 120
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} storage mvcc_bloat
      -duration {{duration|120|1000}} -anchors {{anchors|1}} -mutators {{mutators|8}}
      -rows {{rows|20000}} -payload-kb {{payload-kb|2}}
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# 大对象缓冲挤压：高频插入超大 BLOB 抢占 Buffer Pool（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.buffer.memory_pressure:
  name:
    zh: 大对象缓冲挤压
    en: Buffer Memory Pressure
  description:
    zh: 通过高频插入超大 BLOB 数据抢占 Buffer Pool 资源
    en: Floods the buffer pool with large BLOB inserts to create memory pressure
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    batch:
      type: int
      unit: MB
      default: 100
      required: false
      label:
        zh: 批次大小
        en: Batch Size
      description:
        zh: 单次插入数据大小（MB）
        en: Insert batch size in megabytes
    threads:
      type: int
      default: 4
      required: false
      label:
        zh: 并发线程数
        en: Concurrent Threads
      description:
        zh: 并发写入大对象的线程数
        en: Threads writing large objects concurrently
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} buffer memory_pressure
      -duration {{duration|60|1000}} -batch {{batch|100}} -threads {{threads|4}}
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# 海量事务回滚：高频回滚放大 Undo/Redo/WAL 日志压力
# 自检：check massive_rollback（xact_rollback 两次采样增量）
# rollback-rate 是百分数（80），模板经派生上下文变量 rollbackRate 换算为小数（0.8）
# ------------------------------------------------------------
faultinject.fault.transaction.massive.rollback:
  name:
    zh: 海量事务回滚
    en: Massive Transaction Rollback Storm
  description:
    zh: 并发大量插入并按概率回滚，放大 Undo/Redo 与页面换出压力
    en: Concurrently inserts rows and rolls back at a configurable rate, amplifying undo/redo and page-migration pressure
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    threads:
      type: int
      default: 16
      required: true
      label:
        zh: 并发线程数
        en: Concurrent Threads
      description:
        zh: 并发执行并回滚事务的线程数
        en: Threads running concurrent transactions and rollbacks
    rollback-rate:
      type: int
      unit: '%'
      default: 80
      required: false
      label:
        zh: 回滚比例
        en: Rollback Rate
      description:
        zh: 事务回滚概率的百分数，自动除以 100 传给 DBChaos
        en: Rollback probability in percent, automatically divided by 100 for DBChaos
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} log massive_rollback
      -duration {{duration|60|1000}} -threads {{threads|16}} -rate {{rollbackRate|0.8}}
      -url {{dbUrl}} -user {{user}} -password {{password}}
  check:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} check massive_rollback
      -window-ms 2000 -min-delta 1
      -url {{dbUrl}} -user {{user}} -password {{password}}