# ============================================================
# resbench 故障目录（fault-cases.yaml）— DBChaos 全量故障
#
# 设计文档 §5：故障定义配置化 —— 加新 DB 故障只需在此加一段（并让 DBChaos 实现注入器），
# 无需改 Java、无需重新编译；前端表单/双语/必填/验证徽章全自动。
#
# 本文件覆盖 DBChaos 全部 18 个真实故障 case（registry.json cases）：
#   session/max_connection   ×3 模式（conn_storm / conn_exhaustion / thread_saturation）
#   sql/plan_flip            ×1
#   sql/stack_overflow       ×3 模式（sql_depth / view_nest / join_bomb）
#   exec/stack_overflow      ×3 模式（func_recurse / proc_recurse / trans_recurse）
#   exec/read_amp_trap       ×1
#   txn/uncommitted_txn      ×1
#   txn/duplicate_txn        ×1（mode: UPDATE / INSERT）
#   txn/deadlock_storm       ×1
#   txn/max_prepared         ×1
#   storage/mvcc_bloat       ×1
#   buffer/memory_pressure   ×1
#   log/massive_rollback     ×1
#   另有 quota/test_case：DBChaos 用于验证 JSON 注册/CLI 帮助页联动的自测 case，
#   不是真实故障，故未纳入本目录。
#
# ─ 注入命令必须是 DBChaos v2 语法 ───────────────────────────
#   java -jar {{DBCHAOS_JAR}} --db {{dbType}} <子系统> <case> [参数...]
#   （--db 显式给数据库类型；子系统 session/sql/exec/txn/storage/buffer/log 是必填位置参数。
#     旧格式 "…… {{dbType}} <case>" 缺子系统，会被 DBChaos 判为"命令结构已调整"并静默退出 0，
#     造成注入假成功。本文件所有条目均为 v2 语法。）
#
# ─ 模板语法（§5.3） ──────────────────────────────────────
#   {{var}}                必填（表单参数优先，其次框架上下文变量）
#   {{var|default}}        可缺省
#   {{var|default|1000}}   数值乘 1000（duration 秒 → 毫秒）
#
# ── 框架上下文变量（权威清单见 FaultCatalogLoader.CONTEXT_VARIABLES） ──
#   {{dbType}}       DBChaos 使用的库类型：opengauss / postgresql / mysql
#   {{dbUrl}}        完整 JDBC URL（自动生成）
#   {{user}}         数据库用户名（来自表单数据库配置）
#   {{password}}     数据库密码
#   {{DBCHAOS_JAR}}  DBChaos jar 路径（/opt/DBChaos/DBChaos.jar）
#   {{agentHost}}    agent 地址 ip:8000（注入目标）
#   {{rollbackRate}} 派生变量：由参数 rollback-rate（百分数）÷100 得到的小数，
#                    仅供 massive_rollback 的 -rate 使用
#
# ── 参数单位例外（DBChaos 侧规定） ──────────────────────────
#   txn/duplicate_txn 与 txn/max_prepared 的 -duration 单位是「秒」→ 模板不加 ×1000；
#   其余 case 的 -duration 单位是「毫秒」→ 模板用 {{duration|默认|1000}}。
#
# ── check（自检）覆盖情况 ─────────────────────────────────
#   DBChaos 目前仅实现 3 个 check case（registry 的 check 子系统）：
#     check max_connection   （conn_storm / conn_exhaustion / thread_saturation）
#     check plan_flip        （沙盒表须与注入一致，本文件固定 chaos_plan_flip）
#     check massive_rollback
#   其余 13 个故障没有 check 子命令，按设计 §11.4 不配 check 模板 → 注入照常执行，
#   验证状态显示 UNKNOWN（灰色，附原因「未配置自检命令」），不会误报 ENFORCED。
#   ⚠ 给没有 check 的故障硬配 check 命令 → agent 侧报错 → 状态变成 ERROR（橙色）。
#
# ── v2.2 多语言语法 ────────────────────────────────────────
#   name/description/params.label/params.description 支持两种写法：
#     - 纯字符串（单语，原样显示）
#     - { zh: …, en: … } 对象（前端按当前语言渲染，yaml 优先于 i18n 词典）
#   ⚠ 含英文逗号的文本必须用「块状」多语言写法（zh: 一行 / en: 一行），
#     不要写成行内 { zh: …, en: … } —— 行内 flow mapping 会被英文逗号截断成多余键，
#     SnakeYAML 不报错，但前端会显示残缺（并多出一个 "simulating a ...": null 键）。
#   params 里写 required: true → 前端渲染红色 * 并拦截空值。
#   未写 description 的参数，前端描述行渲染为空（不显示任何内容）。
#
# fake-check.sh 用法（部署到 agent 主机 /opt/agent/faults/，用于演练验证状态机）：
#   bash /opt/agent/faults/fake-check.sh <eventual N|never|timeout SEC|invalid|reset> [key]
#   换模式/重跑前：bash /opt/agent/faults/fake-check.sh reset [key]
# ============================================================


# ============================================================
# 一、连接与会话管理（session / max_connection）
# ============================================================

# ------------------------------------------------------------
# 连接风暴：大量并发连接频繁建立断开
# 自检：check max_connection -mode conn_storm（多次采样取会话数峰值）
# ------------------------------------------------------------
faultinject.fault.connection.surge:
  name:
    zh: 连接风暴
    en: Database Connection Storm
  description:
    zh: 以大量并发线程高频建立并断开数据库连接，模拟连接风暴
    en: Rapidly opens and closes database connections from many concurrent threads, simulating a connection storm
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    concurrent-connections:
      type: int
      default: 200
      required: true
      label:
        zh: 并发连接数
        en: Concurrent Connections
      description:
        zh: 并发短连接线程数，每个线程循环「建连→执行查询→关连接」
        en: Concurrent short-lived connection threads, each looping connect, query and close
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} session max_connection
      -mode conn_storm -count {{concurrent-connections|200}}
      -duration {{duration|60|1000}} -url {{dbUrl}} -user {{user}} -password {{password}}
  check:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} check max_connection
      -mode conn_storm -min-sessions 1
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# 连接池耗尽：抢占连接直至 max_connections 上限
# 自检：check max_connection -mode conn_exhaustion（计数常驻会话）
# ------------------------------------------------------------
faultinject.fault.connection.limit.exceeded:
  name:
    zh: 连接数耗尽
    en: Database Connection Exhaustion
  description:
    zh: 并发抢占远超连接上限的会话并持续持有，模拟连接池耗尽
    en: Grabs and holds far more sessions than the connection limit, exhausting the connection pool
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    attempted-connections:
      type: int
      default: 400
      required: true
      label:
        zh: 目标连接数
        en: Target Connections
      description:
        zh: 想要抢占的连接总数；超过 max_connections 的部分会被拒绝，实际持有数由上限决定
        en: Total connections to grab; those beyond max_connections are refused, so the held count is capped by the limit
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} session max_connection
      -mode conn_exhaustion -count {{attempted-connections|400}}
      -duration {{duration|60|1000}} -url {{dbUrl}} -user {{user}} -password {{password}}
  check:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} check max_connection
      -mode conn_exhaustion -min-sessions 1
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# 连接线程饱和：挤兑会话执行线程池
# 自检：check max_connection -mode thread_saturation（计数常驻会话）
# ------------------------------------------------------------
faultinject.fault.connection.thread_saturation:
  name:
    zh: 连接线程饱和
    en: Connection Thread Saturation
  description:
    zh: 挤兑数据库会话执行线程池，模拟线程池饱和
    en: Saturates the database session worker thread pool by flooding sessions
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    concurrent-connections:
      type: int
      default: 32
      required: true
      label:
        zh: 线程池溢出数
        en: Thread Pool Overflow
      description:
        zh: 在线程池上限之外额外挤占的线程数；实际占用 ≈ min(线程池上限 + 该值, max_connections - 2)
        en: Extra threads beyond the pool limit; actual sessions are about min(pool limit plus this value, max_connections minus 2)
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} session max_connection
      -mode thread_saturation -count {{concurrent-connections|32}}
      -duration {{duration|60|1000}} -url {{dbUrl}} -user {{user}} -password {{password}}
  check:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} check max_connection
      -mode thread_saturation -min-sessions 1
      -url {{dbUrl}} -user {{user}} -password {{password}}


# ============================================================
# 二、SQL 编译与优化（sql）
# ============================================================

# ------------------------------------------------------------
# 执行计划翻转：数据倾斜触发统计信息更新，强制 IndexScan/SeqScan 震荡
# 自检：check plan_flip -table chaos_plan_flip（须与注入的 -table 一致）
# ------------------------------------------------------------
faultinject.fault.sql.plan_flip:
  name:
    zh: 执行计划翻转
    en: SQL Plan Flip
  description:
    zh: 通过构造数据倾斜触发统计信息更新，强制执行计划震荡
    en: Triggers optimizer plan oscillation by forcing statistics updates on skewed data
  category: database
  autoRecovery: 1
  defaultDuration: 60
  asyncInjection: true
  params:
    threads:
      type: int
      default: 16
      required: true
      label:
        zh: 并发线程数
        en: Concurrent Threads
      description:
        zh: 并发执行查询的线程数
        en: Threads running concurrent queries
    count:
      type: int
      default: 1000000
      required: false
      label:
        zh: 倾斜数据行数
        en: Skewed Rows
      description:
        zh: 用于制造倾斜、触发统计信息更新的数据行数
        en: Rows used to create skew and trigger statistics updates
    interval:
      type: int
      unit: ms
      default: 60000
      required: false
      label:
        zh: 跳变周期
        en: Flip Interval
      description:
        zh: 单次执行计划跳变的间隔（毫秒）
        en: Interval between two plan flips in milliseconds
    duration:
      type: int
      unit: s
      default: 60
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} sql plan_flip
      -table chaos_plan_flip -duration {{duration|60|1000}} -threads {{threads|16}}
      -count {{count|1000000}} -interval {{interval|60000}}
      -url {{dbUrl}} -user {{user}} -password {{password}}
  check:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} check plan_flip
      -table chaos_plan_flip
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# 深层表达式解析膨胀：超深逻辑表达式解析爆栈（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.sql.stack_overflow.sql_depth:
  name:
    zh: SQL表达式解析爆栈
    en: SQL Expression Stack Overflow
  description:
    zh: 通过深层递归逻辑表达式解析，模拟内核栈溢出
    en: Overflows the parser stack through deeply nested logical expressions
  category: database
  autoRecovery: 1
  defaultDuration: 30
  asyncInjection: true
  params:
    interval:
      type: int
      unit: ms
      default: 1000
      required: false
      label:
        zh: 注入间隔
        en: Injection Interval
      description:
        zh: 两次注入之间的间隔（毫秒）
        en: Interval between two injections in milliseconds
    duration:
      type: int
      unit: s
      default: 30
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} sql stack_overflow
      -mode sql_depth -duration {{duration|30|1000}} -interval {{interval|1000}}
      -url {{dbUrl}} -user {{user}} -password {{password}}

# ------------------------------------------------------------
# 视图展开深度膨胀：超深度视图嵌套爆栈（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.sql.stack_overflow.view_nest:
