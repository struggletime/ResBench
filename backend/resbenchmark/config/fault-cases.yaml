# ------------------------------------------------------------
# 读取放大陷阱：快照锚点 + 预热膨胀，扫描型查询放大执行器负载（无 check 子命令）
# ------------------------------------------------------------
faultinject.fault.exec.read_amp_trap:
  name:
    zh: 读取放大陷阱
    en: Exec Read Amplification Trap
  description:
    zh: 通过快照锚点和预热膨胀制造大量不可见版本，放大扫描负载
    en: Creates many invisible versions via snapshot anchors and warmup bloat to amplify scan load
  category: database
  autoRecovery: 1
  defaultDuration: 120
  asyncInjection: true
  params:
    warmup:
      type: int
      unit: ms
      default: 30000
      required: false
      label:
        zh: 预热时间
        en: Warmup
      description:
        zh: 制造版本膨胀的预热时长（毫秒）
        en: Warmup duration for version bloat in milliseconds
    anchors:
      type: int
      default: 1
      required: false
      label:
        zh: 锚定事务数
        en: Snapshot Anchors
      description:
        zh: 钉住快照的锚点事务数
        en: Anchor transactions that pin the snapshot
    mutators:
      type: int
      default: 8
      required: false
      label:
        zh: 写入线程数
        en: Mutator Threads
      description:
        zh: 预热阶段并发更新的线程数
        en: Threads performing concurrent updates during warmup
    scanners:
      type: int
      default: 4
      required: false
      label:
        zh: 扫描线程数
        en: Scanner Threads
      description:
        zh: 触发扫描放大的并发线程数
        en: Threads triggering amplified scans
    rows:
      type: int
      default: 30000
      required: false
      label:
        zh: 初始化行数
        en: Initial Rows
      description:
        zh: 沙盒表初始化行数
        en: Rows initialized in the sandbox table
    payload-kb:
      type: int
      unit: KB
      default: 2
      required: false
      label:
        zh: 行载荷大小
        en: Payload Size
      description:
        zh: 每行载荷大小（KB）
        en: Payload size per row in KB
    scan-mode:
      type: string
      default: mixed
      required: false
      label:
        zh: 扫描模式
        en: Scan Mode
      description:
        zh: 扫描方式，可选 seq 顺序扫描 / index 索引扫描 / mixed 混合
        en: Scan mode, one of seq, index or mixed
    duration:
      type: int
      unit: s
      default: 120
      required: false
      label:
        zh: 持续时间
        en: Duration
  injection:
    command: >-
      java -jar {{DBCHAOS_JAR}} --db {{dbType}} exec read_amp_trap
      -duration {{duration|120|1000}} -warmup {{warmup|30000}} -anchors {{anchors|1}}
      -mutators {{mutators|8}} -scanners {{scanners|4}} -rows {{rows|30000}}
      -payload-kb {{payload-kb|2}} -scan-mode {{scan-mode|mixed}}
      -url {{dbUrl}} -user {{user}} -password {{password}}


