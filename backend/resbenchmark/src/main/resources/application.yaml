# Agent host is resolved per request from the target database IP.

# 故障编排合理性校验使用的 Neo4j 知识图谱。
# 不配置 uri（或留空）时使用内置内存示例图谱，不需要 Neo4j 实例。
# 配置后首次校验会校验连通性；连不上时接口返回 checked=false，不影响引擎其他功能。
# 环境变量：RESBENCH_NEO4J_URI / RESBENCH_NEO4J_USERNAME / RESBENCH_NEO4J_PASSWORD /
#           RESBENCH_NEO4J_DATABASE / RESBENCH_NEO4J_CONNECTION_TIMEOUT_MS
# resbench:
#   neo4j:
#     uri: bolt://127.0.0.1:7687
#     username: neo4j
#     password: change-me
#     database: neo4j
#     connection-timeout-ms: 3000
