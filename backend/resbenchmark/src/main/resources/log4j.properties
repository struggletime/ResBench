# Set root logger level to DEBUG and its only appender to A1.
log4j.rootLogger=WARN, A1
log4j.rootLogger.layout=org.apache.log4j.PatternLayout

# A1 is set to be a ConsoleAppender.
log4j.appender.A1=org.apache.log4j.ConsoleAppender
log4j.appender.A1.layout=org.apache.log4j.PatternLayout
log4j.appender.A1.layout.ConversionPattern=[%-5p] %d [%t] %x %c %M - %m%n
log4j.appender.A1.ImmediateFlush=true

log4j.logger.com.resbench=INFO
log4j.logger.com.resbench.DBWorkload=INFO
log4j.logger.com.resbench.ThreadBench=INFO
log4j.logger.com.resbench.DistributionStatistics=INFO
log4j.logger.com.resbench.api.BenchmarkModule=INFO
log4j.logger.com.resbench.api.Loader=INFO
log4j.logger.com.resbench.api.Worker=INFO
log4j.logger.com.resbench.api.Procedure=INFO
log4j.logger.com.resbench.catalog.Catalog=INFO
log4j.logger.com.resbench.util.ThreadUtil=INFO
log4j.logger.com.resbench.benchmarks.auctionmark=INFO
log4j.logger.com.resbench.benchmarks.auctionmark.AuctionMarkWorker=INFO
log4j.logger.com.resbench.benchmarks.auctionmark.AuctionMarkProfile=INFO
log4j.logger.com.resbench.benchmarks.auctionmark.AuctionMarkLoader=INFO
log4j.logger.com.resbench.benchmarks.seats=INFO
log4j.logger.com.resbench.benchmarks.seats.SEATSWorker=INFO
log4j.logger.com.resbench.benchmarks.seats.SEATSProfile=INFO
log4j.logger.com.resbench.benchmarks.seats.SEATSLoader=INFO

## to see UserAbortException messages set this logger to DEBUG
log4j.logger.com.resbench.api.ABORT_LOG=WARN
