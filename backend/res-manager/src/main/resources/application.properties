server.port=8090
spring.application.name=res-manager

res.benchmark.addr.openGauss=http://127.0.0.1:8080

# Optional OpenInsight monitoring sidecar. Failures in this path never alter /suite/* behavior.
res.monitoring.enabled=true
res.monitoring.agent-url=http://YOUR_DB_HOST:19091
res.monitoring.prometheus-url=http://YOUR_DB_HOST:9090
res.monitoring.prometheus-instance=127.0.0.1:19091
res.monitoring.data-dir=data/monitoring
# 前端一次最多选这么多指标；容器测试还会额外追加 2 个容器指标，所以要留出余量。
res.monitoring.max-metrics=32
res.monitoring.max-points=2000
res.monitoring.session-ttl-sec=900
res.monitoring.archive-retention-days=180

res.benchmark.addr.GaussDB=http://127.0.0.1:8081
res.benchmark.addr.OceanBase=http://10.90.54.105:8080
res.benchmark.addr.Real=http://127.0.0.1:8081
